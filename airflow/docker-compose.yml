# MarketSignal — Airflow + MinIO local stack
# Run: docker-compose up -d

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.1-python3.11
  env_file: ../.env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: "jL_sqaxF7BEi9Lh53JCG8nsJFHV1XDKqtXCv_hspdSw="
    AIRFLOW__WEBSERVER__SECRET_KEY: "marketsignal-dev-secret"
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-snowflake==1.8.4" # installed at container start
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ../ingestion:/opt/airflow/ingestion # ingestion scripts available to tasks
    - ../dbt:/opt/airflow/dbt # dbt project available to dbt tasks
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    # single line: indented continuation lines in a `>` block keep their newlines and break bash
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname MarketSignal --lastname Admin --role Admin --email admin@marketsignal.local"
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080" # host 8090 -> Airflow's internal 8080
    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always

  minio:
    image: chainguard/minio:latest # minio/minio & bitnami/minio were pulled from public registries
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # MinIO Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"] # image has no curl
      interval: 30s
      retries: 3

volumes:
  postgres_data:
  minio_data:
